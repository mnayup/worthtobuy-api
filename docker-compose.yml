version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: worthtobuy-postgres
    restart: always
    environment:
      POSTGRES_DB: worthtobuy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d worthtobuy']
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: elestio/minio:latest
    container_name: worthtobuy-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
